name: sight_feasibility_lab
description: "SIGHT Feasibility Study App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0' # Widened constraint to support all plugins

dependencies:
  flutter:
    sdk: flutter
  
  # --- CORE DEPENDENCIES ---
  cupertino_icons: ^1.0.8
  permission_handler: ^12.0.1
  path_provider: ^2.1.2
  
  # --- CAMERA & IMAGING ---
  camera: ^0.11.0
  image_picker: ^1.0.7
  image: ^4.1.7
  
  # --- AI & ML ---
  tflite_flutter: ^0.12.1 # Downgraded slightly to a known stable version for iOS
  google_mlkit_face_detection: ^0.11.0 # Matched directly to TFLite requirements
  google_mlkit_face_mesh_detection: ^0.2.1
  flutter_background: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/sight_model_android.tflite
    - assets/sight_model_ios.tflite
    - assets/labels.txt
    - assets/mascot/