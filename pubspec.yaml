name: lumi
description: "LUMI - Eye Health Monitoring App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0' # Widened constraint to support all plugins

dependencies:
  flutter:
    sdk: flutter
  
  # --- CORE DEPENDENCIES ---
  cupertino_icons: ^1.0.8
  permission_handler: ^12.0.1
  path_provider: ^2.1.2
  wakelock_plus: ^1.2.0
  local_auth: ^2.3.0
  
  # --- CAMERA & IMAGING ---
  camera: ^0.11.0
  image_picker: ^1.0.7
  image: ^4.1.7
  path: ^1.9.0
  sqflite: ^2.4.1
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.4
  http: ^1.2.2
  crypto: ^3.0.6
  
  # --- AI & ML ---
  tflite_flutter: ^0.12.1 # Downgraded slightly to a known stable version for iOS
  google_mlkit_face_detection: ^0.11.0 # Matched directly to TFLite requirements
  google_mlkit_face_mesh_detection: ^0.2.1
  flutter_background: ^1.0.2
  
  # --- WEBVIEW & BACKGROUND NOTIFICATIONS (PHASE 2) ---
  webview_flutter: ^4.4.2
  flutter_local_notifications: ^17.1.2
  
  # --- HAPTIC & AUDIO FEEDBACK ---
  vibration: ^3.0.0
  just_audio: ^0.9.36
  
  # --- CHARTS & VISUALIZATION ---
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/sight_model_android.tflite
    - assets/sight_model_ios.tflite
    - assets/labels.txt
    - assets/mascot/
    - assets/media_hub/
    - assets/app_icons/